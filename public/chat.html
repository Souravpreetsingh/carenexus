<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Safe Space | Chat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/socket.io/socket.io.js"></script>
<script>
  tailwind.config={darkMode:"class",theme:{extend:{colors:{
    "secondary-container":"#b5edec","on-secondary-container":"#225a5a",
    "outline-variant":"#bbbaaf","on-surface-variant":"#65655c",
    "on-primary":"#ffffff","surface":"#fdffda","on-surface":"#383830",
    "surface-container-low":"#fcf9f0","surface-container-lowest":"#ffffff",
    "surface-container-high":"#f0eee3","primary-container":"#b9ece7",
    "on-primary-container":"#285a56","primary":"#3c6d69","primary-dim":"#2f605d",
    "error":"#af3d3b"
  },fontFamily:{"headline":["Manrope"],"body":["Inter"]}}}}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  body{min-height:100dvh;background:#fdffda;}
  .hide-scrollbar::-webkit-scrollbar{display:none;}
  .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
</style>
</head>
<body class="font-body text-on-surface flex flex-col h-screen">

<!-- Header -->
<header class="w-full bg-[#fdffda] flex justify-between items-center px-6 py-4 flex-shrink-0">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center">
      <span class="material-symbols-outlined text-primary">spa</span>
    </div>
    <h1 class="font-['Manrope'] font-bold text-[#3c6d69] tracking-tight text-lg">Safe Space</h1>
  </div>
  <div class="flex items-center gap-2">
    <button onclick="startCall('audio')" title="Voice Call"
      class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-primary/10 text-primary hover:bg-primary/20 transition-colors text-sm font-semibold">
      <span class="material-symbols-outlined text-[18px]">call</span>
      <span class="hidden sm:inline">Voice</span>
    </button>
    <button onclick="startCall('video')" title="Video Call"
      class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-primary/10 text-primary hover:bg-primary/20 transition-colors text-sm font-semibold">
      <span class="material-symbols-outlined text-[18px]">videocam</span>
      <span class="hidden sm:inline">Video</span>
    </button>
    <button onclick="endSession()" class="flex items-center gap-2 px-4 py-2 rounded-xl text-error bg-error/5 hover:bg-error/10 transition-colors border border-error/10 text-sm font-semibold">
      <span class="material-symbols-outlined text-[18px]">logout</span> End
    </button>
  </div>
</header>

<!-- Chat identity banner -->
<div class="flex flex-col items-center py-5 flex-shrink-0">
  <div class="relative mb-3">
    <div class="absolute inset-0 bg-primary-container/30 blur-2xl rounded-full"></div>
    <div class="relative w-16 h-16 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-sm">
      <span class="material-symbols-outlined text-[32px] text-primary">support_agent</span>
    </div>
    <div class="absolute bottom-1 right-1 w-4 h-4 bg-primary border-4 border-surface rounded-full"></div>
  </div>
  <h2 id="chatTitle" class="font-headline text-xl font-bold text-on-surface tracking-tight mb-1">Anonymous Mentor</h2>
  <p class="text-on-surface-variant text-xs max-w-xs text-center">This space is completely private. Your identity remains protected.</p>
</div>

<!-- Messages -->
<div id="messages" class="flex-1 overflow-y-auto hide-scrollbar px-4 md:px-8 max-w-4xl w-full mx-auto space-y-4 pb-4">
  <div class="flex justify-center">
    <span class="px-3 py-1 bg-surface-container-high rounded-full text-[11px] font-medium text-on-surface-variant uppercase tracking-wider">Today</span>
  </div>
</div>

<!-- Input -->
<div class="flex-shrink-0 max-w-4xl w-full mx-auto px-4 md:px-8 pb-8 pt-2">
  <div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-[2rem] p-3 shadow-[0_12px_40px_rgba(56,56,48,0.08)] border border-outline-variant/15">
    <div class="flex items-center gap-2">
      <input id="msgInput" type="text" placeholder="Type your feelings here..."
        class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-on-surface-variant/50 font-body py-3 px-2 outline-none text-sm"/>
      <button onclick="sendMessage()"
        class="bg-primary hover:bg-primary-dim text-on-primary w-12 h-12 rounded-full flex items-center justify-center transition-all active:scale-95 shadow-lg shadow-primary/20">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">send</span>
      </button>
    </div>
  </div>
  <div class="flex justify-center mt-3">
    <div class="flex items-center gap-1.5 opacity-40">
      <span class="material-symbols-outlined text-[14px]">lock</span>
      <span class="text-[10px] font-medium tracking-wide">END-TO-END ENCRYPTED &amp; ANONYMOUS</span>
    </div>
  </div>
</div>

<!-- Incoming call modal -->
<div id="incomingModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-2xl flex flex-col items-center gap-6 w-80">
    <div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center animate-pulse">
      <span id="incomingIcon" class="material-symbols-outlined text-primary text-4xl">call</span>
    </div>
    <div class="text-center">
      <p class="font-headline font-bold text-xl">Incoming Call</p>
      <p id="incomingType" class="text-on-surface-variant text-sm mt-1">Voice Call</p>
    </div>
    <div class="flex gap-4">
      <button onclick="rejectCall()"
        class="w-14 h-14 rounded-full bg-error flex items-center justify-center text-white shadow-lg hover:opacity-90 active:scale-95 transition-all">
        <span class="material-symbols-outlined">call_end</span>
      </button>
      <button onclick="acceptCall()"
        class="w-14 h-14 rounded-full bg-primary flex items-center justify-center text-white shadow-lg hover:opacity-90 active:scale-95 transition-all">
        <span class="material-symbols-outlined">call</span>
      </button>
    </div>
  </div>
</div>

<!-- Active call overlay -->
<div id="callOverlay" class="hidden fixed inset-0 z-40 bg-on-surface/95 flex flex-col items-center justify-between py-12">
  <!-- Video elements -->
  <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover opacity-90"></video>
  <video id="localVideo" autoplay playsinline muted class="absolute bottom-28 right-4 w-32 h-44 object-cover rounded-2xl border-2 border-white/20 shadow-xl z-10"></video>

  <div class="relative z-10 text-center text-white">
    <p class="font-headline font-bold text-2xl" id="callStatusText">Calling...</p>
    <p id="callTimer" class="text-white/60 text-sm mt-1"></p>
  </div>

  <!-- Call controls -->
  <div class="relative z-10 flex items-center gap-6">
    <button onclick="toggleMute()" id="muteBtn"
      class="w-14 h-14 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-white transition-all">
      <span class="material-symbols-outlined">mic</span>
    </button>
    <button onclick="hangUp()"
      class="w-16 h-16 rounded-full bg-error flex items-center justify-center text-white shadow-xl hover:opacity-90 active:scale-95 transition-all">
      <span class="material-symbols-outlined text-3xl">call_end</span>
    </button>
    <button onclick="toggleCamera()" id="cameraBtn"
      class="w-14 h-14 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-white transition-all">
      <span class="material-symbols-outlined">videocam</span>
    </button>
  </div>
</div>

<div class="fixed top-[20%] -left-[10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-[10%] -right-[10%] w-[30%] h-[30%] bg-secondary-container/20 blur-[100px] rounded-full -z-10"></div>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');
const roomId = localStorage.getItem('roomId');
const sessionId = localStorage.getItem('sessionId');
if (!token || !user || !roomId) location.href = 'dashboard.html';

document.getElementById('chatTitle').textContent = user.role === 'mentor' ? 'Chatting with User' : 'Chatting with Mentor';

const socket = io();
socket.emit('join-room', roomId);

fetch(`/api/sessions/${roomId}/messages`, {headers:{'Authorization':`Bearer ${token}`}})
  .then(r => r.json()).then(data => {
    if (data.messages && data.messages.length > 0)
      data.messages.forEach(m => appendMessage(m.text, m.senderRole, m.createdAt));
  });

socket.on('receive-message', ({text, senderRole, createdAt}) => appendMessage(text, senderRole, createdAt));

function appendMessage(text, senderRole, createdAt) {
  const box = document.getElementById('messages');
  const isMe = senderRole === user.role;
  const time = new Date(createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const label = senderRole === 'mentor' ? 'Mentor' : 'User';
  const wrap = document.createElement('div');
  wrap.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
  if (!isMe) {
    wrap.innerHTML = `<div class="flex items-start gap-3 max-w-[85%]">
      <div class="w-8 h-8 rounded-full bg-primary-container flex-shrink-0 flex items-center justify-center">
        <span class="material-symbols-outlined text-[18px] text-primary">diversity_1</span>
      </div>
      <div>
        <div class="bg-surface-container-low p-4 rounded-2xl rounded-tl-none shadow-sm text-on-surface leading-relaxed text-sm">${escHtml(text)}</div>
        <span class="text-[10px] text-on-surface-variant/60 ml-1 mt-1 block">${label} · ${time}</span>
      </div>
    </div>`;
  } else {
    wrap.innerHTML = `<div class="flex items-end gap-3 max-w-[85%]">
      <div>
        <div class="bg-primary text-on-primary p-4 rounded-2xl rounded-br-none shadow-sm leading-relaxed text-sm">${escHtml(text)}</div>
        <span class="text-[10px] text-on-surface-variant/60 mr-1 mt-1 block text-right">You · ${time}</span>
      </div>
    </div>`;
  }
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('send-message', {roomId, senderId: user.id, senderRole: user.role, text});
  input.value = '';
}

document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

async function endSession() {
  if (!confirm('End this session?')) return;
  hangUp();
  await fetch(`/api/sessions/${sessionId}/complete`, {method:'POST', headers:{'Authorization':`Bearer ${token}`}});
  socket.emit('leave-room', roomId);
  localStorage.removeItem('roomId');
  localStorage.removeItem('sessionId');
  location.href = 'dashboard.html';
}

function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── WebRTC Call Logic ────────────────────────────────────────────────────────

let pc = null;
let localStream = null;
let callType = 'audio';
let isMuted = false;
let isCameraOff = false;
let callTimerInterval = null;
let callSeconds = 0;
let pendingOffer = null;

const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

async function startCall(type) {
  callType = type;
  try {
    localStream = await navigator.mediaDevices.getUserMedia(
      type === 'video' ? { audio: true, video: true } : { audio: true, video: false }
    );
    document.getElementById('localVideo').srcObject = localStream;
    setupPeerConnection();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('call-offer', { roomId, offer, callType: type });
    showCallOverlay('Calling...');
  } catch (e) {
    alert('Could not access microphone/camera: ' + e.message);
  }
}

function setupPeerConnection() {
  pc = new RTCPeerConnection(iceConfig);
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = e => {
    document.getElementById('remoteVideo').srcObject = e.streams[0];
  };

  pc.onicecandidate = e => {
    if (e.candidate) socket.emit('call-ice', { roomId, candidate: e.candidate });
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      document.getElementById('callStatusText').textContent = 'Connected';
      startCallTimer();
    }
    if (['disconnected','failed','closed'].includes(pc.connectionState)) hangUp();
  };
}

// ── Signaling events ──────────────────────────────────────────────────────────

socket.on('call-offer', async ({ offer, callType: type }) => {
  callType = type;
  pendingOffer = offer;
  document.getElementById('incomingIcon').textContent = type === 'video' ? 'videocam' : 'call';
  document.getElementById('incomingType').textContent = type === 'video' ? 'Video Call' : 'Voice Call';
  document.getElementById('incomingModal').classList.remove('hidden');
});

socket.on('call-answer', async ({ answer }) => {
  if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('call-ice', async ({ candidate }) => {
  if (pc) await pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
});

socket.on('call-ended', () => cleanupCall());

// ── Accept / Reject ───────────────────────────────────────────────────────────

async function acceptCall() {
  document.getElementById('incomingModal').classList.add('hidden');
  try {
    localStream = await navigator.mediaDevices.getUserMedia(
      callType === 'video' ? { audio: true, video: true } : { audio: true, video: false }
    );
    document.getElementById('localVideo').srcObject = localStream;
    setupPeerConnection();
    await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('call-answer', { roomId, answer });
    showCallOverlay('Connecting...');
  } catch (e) {
    alert('Could not access microphone/camera: ' + e.message);
  }
}

function rejectCall() {
  document.getElementById('incomingModal').classList.add('hidden');
  socket.emit('call-ended', { roomId });
}

function hangUp() {
  socket.emit('call-ended', { roomId });
  cleanupCall();
}

function cleanupCall() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  document.getElementById('callOverlay').classList.add('hidden');
  document.getElementById('incomingModal').classList.add('hidden');
  clearInterval(callTimerInterval);
  callSeconds = 0;
  document.getElementById('callTimer').textContent = '';
}

function showCallOverlay(status) {
  document.getElementById('callStatusText').textContent = status;
  document.getElementById('callOverlay').classList.remove('hidden');
  // hide camera button for audio-only calls
  document.getElementById('cameraBtn').style.display = callType === 'audio' ? 'none' : 'flex';
}

function startCallTimer() {
  callSeconds = 0;
  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    document.getElementById('callTimer').textContent = `${m}:${s}`;
  }, 1000);
}

function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const btn = document.getElementById('muteBtn').querySelector('span');
  btn.textContent = isMuted ? 'mic_off' : 'mic';
}

function toggleCamera() {
  if (!localStream) return;
  isCameraOff = !isCameraOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !isCameraOff);
  const btn = document.getElementById('cameraBtn').querySelector('span');
  btn.textContent = isCameraOff ? 'videocam_off' : 'videocam';
}
</script>
</body>
</html>
